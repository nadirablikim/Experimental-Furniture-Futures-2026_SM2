<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Found Vessel Pendants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* Layout: one-screen workbench — the axonometric stage fills the height, a narrow spec panel sits beside it */
:root{
  --bg:#e6e7e4; --panel:#f3f3f1; --fg:#1d1e1c; --muted:#62645f; --line:#c9cbc5;
  --rust:#b9531c; --stage:#16130f;
  --display:"Archivo Narrow","Noto Sans SC",system-ui,sans-serif;
  --body:"Noto Sans SC",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#131412; --panel:#1c1d1b; --fg:#e9e8e3; --muted:#9b9c95; --line:#33352f; --rust:#e07a3e; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131412; --panel:#1c1d1b; --fg:#e9e8e3; --muted:#9b9c95; --line:#33352f; --rust:#e07a3e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--body);padding-inline:clamp(12px,2vw,24px);padding-block:12px}
.app{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:12px;height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:520px}
.stage{position:relative;min-width:0;height:100%;background:var(--stage);border-radius:4px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.title{position:absolute;left:14px;top:12px;pointer-events:none;color:#efe7dc}
.title h1{margin:0;font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.01em}
.title div{font-family:var(--mono);font-size:11px;opacity:.7;margin-top:2px}
.tag{position:absolute;pointer-events:none;transform:translate(-50%,-100%);font-family:var(--mono);font-size:11px;color:#efe7dc;white-space:nowrap;text-align:center;line-height:1.35;text-shadow:0 1px 2px #000}
.tag b{display:block;font-family:var(--display);font-weight:600;font-size:15px}
.wm{position:absolute;left:14px;bottom:12px;display:flex;align-items:center;gap:10px;color:#efe7dc;opacity:.78;transition:opacity .2s}
.wm:hover,.wm:focus-within{opacity:1}
.wm-logo{height:34px;width:auto;display:block;flex:none;color:#efe7dc}
.wm-txt{display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:11px;line-height:1.3}
.wm-txt b{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.03em}
.wm-txt span{display:flex;gap:8px}
.wm a{color:#efe7dc;text-decoration:none;border-bottom:1px solid #efe7dc66}
.wm a:hover{border-bottom-color:#efe7dc}
.hint{position:absolute;right:12px;bottom:10px;font-family:var(--mono);font-size:11px;color:#efe7dc99}
.err{position:absolute;inset:0;display:grid;place-items:center;color:#efe7dc;font-family:var(--mono);font-size:13px;padding:24px;text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.sec{padding:11px 13px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.lbl{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.top{display:flex;justify-content:space-between;align-items:center}
.lang{display:flex;gap:3px}
.lang button{padding:2px 7px;font-size:11.5px}
.row{display:flex;gap:5px;align-items:center}
.row > *{flex:1}
button,select{font:500 12.5px var(--body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:3px;padding:5px 8px;cursor:pointer}
.seg button{font-family:var(--display);font-size:15px;font-weight:600;padding:6px 2px}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:hover,select:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
select{width:100%}
.part{display:flex;flex-direction:column;gap:5px}
.part + .part{padding-top:9px;border-top:1px dashed var(--line)}
.part h3{margin:0;font-size:13.5px;font-weight:500;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.part h3 small{font-weight:400;font-size:11.5px;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.chips button{font-size:11.5px;padding:3px 0;border-radius:2px}
.chips button[aria-pressed="true"]{background:var(--rust);border-color:var(--rust);color:#fff}
input[type=range]{accent-color:var(--rust);width:100%}
.note{font-size:12px;line-height:1.6;color:var(--muted);margin:0}
@media (max-width:860px){
  .app{grid-template-columns:1fr;height:auto}
  .stage{height:auto;aspect-ratio:4/5}
  .panel{overflow:visible}
}
</style>
</head>

        <div class="lang" role="group" aria-label="Language"><button id="lang-zh" aria-pressed="true">中文</button><button id="lang-en" aria-pressed="false">EN</button></div></div>
      <div class="seg" role="group" aria-label="type">
        <button id="type-eclipse" aria-pressed="true"></button>
        <button id="type-rise" aria-pressed="false"></button>
        <button id="type-phase" aria-pressed="false"></button>
      </div>
    </div>
    <div class="sec" id="parts"></div>
    <div class="sec">
      <span class="lbl" data-i18n="ctrl">动画 · 环境 · 视角</span>
      <div class="row"><button id="play" aria-pressed="true">暂停</button><input id="speed" type="range" min="0.2" max="3" step="0.1" value="1" aria-label="动画速度"></div>
      <div class="row"><button id="night" aria-pressed="true">夜景</button><button id="v-room" aria-pressed="true" data-i18n="room">整体</button><button id="v-close" aria-pressed="false" data-i18n="close">特写</button></div>
    </div>
    <div class="sec"><p class="note" id="note"></p></div>
  </aside>
</div>

function makeMats(base, procs, glow){
  const ox=procs.has('ox'), perf=procs.has('perf'), sand=procs.has('sand');
  let I={}, O={}, physical=false, translucent=false, spec=.2, natural=false, grid=false, glowK=0, emMapIn=null, emMapOut=null;
  switch(base){
    case 'rust': I={map:imgTex('pitIn'), roughness:.85, metalness:.35}; O={map:imgTex('pitOut',1), roughness:.55, metalness:.5}; natural=true; spec=.15; break;
    case 'mesh': I=O={color:0x2b2621, metalness:.55, roughness:.5, alphaMap:wireTex, transparent:true, depthWrite:false}; grid=true; spec=.1; break;
    case 'steel': I=O={color:0xd4d6da, metalness:1, roughness:.28}; spec=1; break;
    case 'glaze': I={map:imgTex('glaze'), roughness:.22}; O={color:0x8a8fb6, roughness:.3}; spec=.45; break;
    case 'ikea': I={color:0xefe6d2, roughness:.5}; O={color:0xece3cf, roughness:.62, bumpMap:dotsTex, bumpScale:2}; spec=.15; break;
    case 'paper': I=O={color:0xf4f2ee, roughness:1}; translucent=true; glowK=1.25; spec=.03; break;
    case 'xmas': I={map:imgTex('xmas'), roughness:1}; O={color:0xf4f2ee, roughness:1}; translucent=true; glowK=1.1; emMapIn=emMapOut=imgTex('xmas'); spec=.03; break;
    case 'plastic': physical=true; I=O={color:0xffffff, transmission:1, roughness:.04, thickness:.003, ior:1.45, metalness:0}; translucent=true; glowK=.12; spec=.35; break;
  }
  I={...I}; O={...O};
  if(ox){ for(const m of [I,O]){ m.map=heatTex; m.color=0xffffff; m.metalness=Math.max(m.metalness??0,.55); m.roughness=.3; } emMapIn=emMapOut=null; }
  if(sand){ for(const m of [I,O]){ m.roughness=Math.max(m.roughness??.5,.82); if(base==='steel'||base==='rust') m.metalness=.75; }
    if(base==='plastic'){ physical=false; for(const m of [I,O]){ delete m.transmission; delete m.thickness; delete m.ior; m.color=0xf3efe8; m.transparent=true; m.opacity=.93; } glowK=1.0; spec=.08; }
    else spec*=.35; }
  if(natural||perf){ const a=alphaTex(natural,perf); for(const m of [I,O]){ m.alphaMap=a; m.alphaTest=.5; } }
  if(translucent && glow){ I.emissive=O.emissive=WARM; I.emissiveIntensity=O.emissiveIntensity=glowK; if(emMapIn){ I.emissiveMap=emMapIn; O.emissiveMap=emMapOut; I.emissive=O.emissive=0xffffff; } }
  const K = physical ? THREE.MeshPhysicalMaterial : THREE.MeshStandardMaterial;
  const inner = new K({...I, side:THREE.BackSide}), outer = new K({...O, side:THREE.FrontSide, shadowSide:THREE.DoubleSide});
  let depth=null, dist=null;
  if(grid){ depth=new THREE.MeshDepthMaterial({alphaMap:wireShadowTex, alphaTest:.5}); dist=new THREE.MeshDistanceMaterial({alphaMap:wireShadowTex, alphaTest:.5}); }
  return {inner, outer, cast:!translucent, depth, dist, spec};
}

function planarUV(geo, R){
  const p=geo.attributes.position, a=new Float32Array(p.count*2), b=new Float32Array(p.count*2);
  for(let i=0;i<p.count;i++){ const x=p.getX(i), z=p.getZ(i); a[i*2]=.5+x/(2*R); b[i*2]=.5-x/(2*R); a[i*2+1]=b[i*2+1]=.5-z/(2*R); }
  geo.setAttribute('uv',new THREE.BufferAttribute(a,2)); geo.setAttribute('uv1',new THREE.BufferAttribute(b,2)); return geo;
}
const V2 = pts => pts.map(([r,h])=>new THREE.Vector2(r,h));

  dome: Array.from({length:25},(_,i)=>{ const a=Math.PI/2*(i/24); return [.292*Math.sin(a)+.0005, .17*(1-Math.cos(a))]; }),
  dish: [[0.001,0],[.04,.003],[.06,.012],[.072,.024],[.08,.032],[.083,.03]],

const maxR = prof => Math.max(...prof.map(p=>p[0]));

let glintRecs = [];
function buildVessel(prof, choice, glow){
  const g = new THREE.Group(); if(choice.mat==='none') return g;
  const M = makeMats(choice.mat, choice.procs, glow), R=maxR(prof);
  const add = (geo, holder)=>{ const i=new THREE.Mesh(geo,M.inner), o=new THREE.Mesh(geo,M.outer);
    i.receiveShadow=true; o.receiveShadow=true; o.castShadow=M.cast; if(M.depth){ o.customDepthMaterial=M.depth; o.customDistanceMaterial=M.dist; }
    holder.add(i,o); };
  if(!choice.procs.has('frag')){ add(planarUV(new THREE.LatheGeometry(V2(prof),96),R), g); return g; }
  // fragments: split the profile into bands and wedges, each tilted a little
  const n=prof.length-1, bands=n>14?3:2, per=Math.ceil(n/bands); let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let b=0;b<bands;b++){ const sub=prof.slice(b*per, Math.min(n,(b+1)*per)+1); if(sub.length<2) continue;
    const rMid=sub[Math.floor(sub.length/2)][0], wedges=Math.max(5,Math.round(rMid/R*16)), dphi=Math.PI*2/wedges, gap=.045;
    for(let k=0;k<wedges;k++){ const geo=planarUV(new THREE.LatheGeometry(V2(sub),4,k*dphi+gap+(b%2)*dphi/2,dphi-2*gap),R);
      geo.computeBoundingBox(); const c=new THREE.Vector3(); geo.boundingBox.getCenter(c); geo.translate(-c.x,-c.y,-c.z);
      const h=new THREE.Object3D(); h.position.copy(c); h.rotation.set((rnd()-.5)*.4,(rnd()-.5)*.4,(rnd()-.5)*.4); add(geo,h); g.add(h);
      const phi=k*dphi+(b%2)*dphi/2+dphi/2, j=Math.floor(sub.length/2), t2=new THREE.Vector2(sub[Math.min(j+1,sub.length-1)][0]-sub[Math.max(j-1,0)][0], sub[Math.min(j+1,sub.length-1)][1]-sub[Math.max(j-1,0)][1]).normalize();
      const nl=new THREE.Vector3(t2.y*Math.sin(phi), -t2.x, t2.y*Math.cos(phi)).normalize();
      glintRecs.push({obj:h, n:nl, spec:M.spec}); } }
  return g;
}

    const spill=new THREE.SpotLight(0xffb070,.5,0,1.05,1,2); spill.position.set(0,0,-mc.D*.5); cg.add(spill); const tg=new THREE.Object3D(); tg.position.set(0,-.4,1.2); cg.add(tg); spill.target=tg;
    root.add(rod(P(0,hang,0),P(0,1.75,0)), rod(P(0,mb.R,gap+mb.D*.5),P(0,1.75,gap+mb.D*.5),.002));
    swing.add(rod(P(0,0,0),P(0,-hang+mc.R,-mc.D*.5),.004,brightMetal), new THREE.Mesh(new THREE.SphereGeometry(.014,16,12),brightMetal));
    L.update=t=>{ swing.rotation.z=.17*Math.sin(t*.5); };
    L.size=Math.max(mc.R,mb.R); L.top=Math.max(mc.R,mb.R)+.12;
  }
  if(type==='rise'){
    const mu=meta(S.upper.obj), ml=meta(S.lower.obj);
    root.position.set(0,1.28,-.55);
    const lo=new THREE.Group(); lo.position.y=-ml.D; root.add(lo); lo.add(buildObj(S.lower,true));
    const up=new THREE.Group(); root.add(up);
    const uo=new THREE.Group(); uo.rotation.x=Math.PI; uo.position.y=mu.D; up.add(uo); uo.add(buildObj(S.upper,true));
    const bulb=new THREE.Group(); bulb.position.y=Math.min(mu.D*.45,.05); up.add(bulb);
    const glass=new THREE.Mesh(new THREE.SphereGeometry(.03,32,20),new THREE.MeshStandardMaterial({color:0xfff6e6,emissive:0xffd9a8,emissiveIntensity:2.2,roughness:.4}));
    const sock=new THREE.Mesh(new THREE.CylinderGeometry(.013,.013,.035,20),cableMat); sock.position.y=.04; bulb.add(glass,sock);
    L.light=lampLight(.45); bulb.add(L.light); bulb.add(halo(.35,.45));
    const wr=ml.R+.007; for(let i=0;i<3;i++){ const a=i*Math.PI*2/3+.3; root.add(rod(P(Math.cos(a)*wr,0,Math.sin(a)*wr),P(Math.cos(a)*wr,1.75,Math.sin(a)*wr),.0012)); }
    const upRod=rod(P(0,0,0),P(0,1,0),.003); root.add(upRod);
    L.update=t=>{ const gap=.012+.24*(.5-.5*Math.cos(t*.5)); up.position.y=gap; setRod(upRod,P(0,gap+mu.D,0),P(0,1.75,0)); };
    L.size=Math.max(mu.R,ml.R,.18); L.top=.42+mu.D;
  }
  if(type==='phase'){
    const mi=meta(S.inner.obj), ms=meta(S.shell.obj);
    root.position.set(0,1.32,-.5);
    const io=new THREE.Group(); io.rotation.x=Math.PI; io.position.y=mi.D; root.add(io); io.add(buildObj(S.inner,true));
    const glass=new THREE.Mesh(new THREE.SphereGeometry(.024,24,16),new THREE.MeshStandardMaterial({color:0xfff6e6,emissive:0xffd9a8,emissiveIntensity:2}));
    glass.position.y=.004; root.add(glass);
    L.light=lampLight(.5,2048); L.light.position.y=-.004; root.add(L.light);
    root.add(rod(P(0,mi.D,0),P(0,1.75,0),.005,brightMetal));
    const rot=new THREE.Group(); root.add(rot);
    const rimOff=Math.max(mi.R+.03-ms.D, -ms.D*.45), cy=-Math.min(ms.R*.3,.08);
    const so=new THREE.Group(); so.rotation.x=-Math.PI/2; so.position.set(0,cy,rimOff+ms.D); rot.add(so); so.add(buildObj(S.shell,true));
    const collar=new THREE.MeshStandardMaterial({color:0x6c6e72,metalness:.9,roughness:.35});
    const cTop=new THREE.Mesh(new THREE.CylinderGeometry(.013,.013,.02,20),collar); cTop.position.y=mi.D+.035; rot.add(cTop);
    rot.add(rod(P(0,mi.D+.035,0),P(0,mi.D+.035,rimOff+ms.D*.5),.004,brightMetal), rod(P(0,mi.D+.035,rimOff+ms.D*.5),P(0,cy+ms.R*.97,rimOff+ms.D*.5),.004,brightMetal));
    L.update=t=>{ const s=t/3.2, i=Math.floor(s), f=s-i, e=f<.25?(1-Math.cos(f/.25*Math.PI))/2:1; rot.rotation.y=(i+e)*Math.PI/4+.4; };
    L.size=Math.max(ms.R+Math.max(0,rimOff+ms.D)*.6,mi.R); L.top=mi.D+.2;
  }
  L.focus=P(0,root.position.y,root.position.z+.1); L.tagPos=P(0,root.position.y+L.top+.1,root.position.z);
  return L;
}

/* ---------- glints: mirror spots thrown by fragment pieces ---------- */
const glints=new THREE.InstancedMesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:glowSprite,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}),400);
glints.instanceMatrix.setUsage(THREE.DynamicDrawUsage); glints.frustumCulled=false; scene.add(glints);
const PLANES=[{axis:'y',d:0,n:P(0,1,0),q:new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI/2,0,0))},
  {axis:'z',d:ROOM.back,n:P(0,0,1),q:new THREE.Quaternion()},{axis:'x',d:ROOM.left,n:P(1,0,0),q:new THREE.Quaternion().setFromEuler(new THREE.Euler(0,Math.PI/2,0))}];
const _m=new THREE.Matrix4(), _q=new THREE.Quaternion(), _p=new THREE.Vector3(), _s=new THREE.Vector3(), _c=new THREE.Color(), LP=new THREE.Vector3();
function updateGlints(){
  lamp.light.getWorldPosition(LP); let i=0;
  for(const g of glintRecs){ if(i>=400) break;
    g.obj.getWorldPosition(_p); g.obj.getWorldQuaternion(_q);
    const n=g.n.clone().applyQuaternion(_q); const d=_p.clone().sub(LP).normalize(); if(n.dot(d)>0) n.negate();
    const cosi=-d.dot(n); if(cosi<.05) continue;
    const r=d.clone().addScaledVector(n,2*cosi); let best=null;
    for(const PL of PLANES){ const den=r[PL.axis]; if(Math.abs(den)<1e-4) continue; const tt=(PL.d-_p[PL.axis])/den; if(tt>.05&&(!best||tt<best.t)) best={t:tt,PL}; }
    if(!best) continue; const hit=_p.clone().addScaledVector(r,best.t);
    if(hit.x<ROOM.left-.01||hit.x>ROOM.right||hit.z<ROOM.back-.01||hit.z>ROOM.front||hit.y>ROOM.top) continue;
    hit.addScaledVector(best.PL.n,.003); const size=.04+.05*best.t; _s.set(size,size*(1.2-cosi*.4),1);
    _m.compose(hit,best.PL.q,_s); glints.setMatrixAt(i,_m);
    const b=Math.min(1,cosi*1.3)*.95*g.spec/(1+best.t*best.t*.35); glints.setColorAt(i++,_c.setRGB(b,b*.86,b*.66)); }
  glints.count=i; glints.instanceMatrix.needsUpdate=true; if(glints.instanceColor) glints.instanceColor.needsUpdate=true;
}



/* ---------- camera ---------- */
const camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,50);
const dir=P(1.05,.78,1.3).normalize();
const controls=new OrbitControls(camera,canvas); controls.enableDamping=true; controls.minZoom=.5; controls.maxZoom=6;
controls.maxPolarAngle=Math.PI*.49; controls.minAzimuthAngle=-.1; controls.maxAzimuthAngle=Math.PI/2+.1;
function resize(){ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false); const asp=w/h, H=asp<1?3.2:2.5;
  camera.left=-H*asp/2; camera.right=H*asp/2; camera.top=H/2; camera.bottom=-H/2; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();
let view='room', tween=null;
const viewTarget=()=> view==='room' ? {f:P(0,1.3,-.35), z:1} : {f:lamp.focus.clone(), z:Math.min(3.5, .5/Math.max(lamp.size,.15))};
function goView(v, instant){ view=v; const T=viewTarget(); const off=camera.position.clone().sub(controls.target);
  if(instant){ controls.target.copy(T.f); camera.position.copy(T.f).addScaledVector(dir,12); camera.zoom=T.z; camera.updateProjectionMatrix(); }
  else tween={t:0,f0:controls.target.clone(),f1:T.f,z0:camera.zoom,z1:T.z,off};
  for(const id of ['room','close']) document.getElementById('v-'+id).setAttribute('aria-pressed',id===v); }
document.getElementById('v-room').onclick=()=>goView('room'); document.getElementById('v-close').onclick=()=>goView('close');

/* ---------- panel ---------- */
const partsEl=document.getElementById('parts');
function renderPanel(){
  const T=TYPES[curType], S=state[curType]; partsEl.innerHTML=`<span class="lbl">${tr('parts')}</span>`;
  for(const p of T.parts){ const key=p[0], [label,role]=partText(curType,p), st=S[key];
    const usedBy=Object.fromEntries(T.parts.filter(q=>q[0]!==key).map(q=>[S[q[0]].obj,partText(curType,q)[0]]));
    const opts=Object.entries(OBJ).map(([k,o])=>`<option value="${k}"${k===st.obj?' selected':''}${usedBy[k]?' disabled':''}>${objName(k)} ${o.size}${usedBy[k]?(lang==='en'?` (${tr('used')} ${usedBy[k]})`:`（${tr('used')}${usedBy[k]}）`):''}</option>`).join('');
    const div=document.createElement('div'); div.className='part';
    div.innerHTML=`<h3>${label}<small>${role}</small></h3><select id="o-${curType}-${key}" aria-label="${label}用的物件">${opts}</select><div class="chips" role="group" aria-label="${label}的加工">${PROCS.map(([p])=>`<button data-p="${p}" aria-pressed="${st.procs.has(p)}" title="${tr('procs')[p][1]}">${tr('procs')[p][0]}</button>`).join('')}</div>`;
    div.querySelector('select').onchange=e=>{ st.obj=e.target.value; rebuild(); };
    div.querySelectorAll('.chips button').forEach(b=>{ b.onclick=()=>{ const p=b.dataset.p; st.procs.has(p)?st.procs.delete(p):st.procs.add(p); rebuild(); }; });
    partsEl.appendChild(div); }
  document.getElementById('note').textContent= lang==='en'?TYPE_EN[curType].note:T.note;
  document.getElementById('tagName').textContent= lang==='en'?TYPE_EN[curType].name:T.name;
  document.getElementById('tagSub').textContent=T.parts.map(p=>`${partText(curType,p)[0]}${tr('sep')}${objName(S[p[0]].obj)}`).join(' · ');
  for(const t of Object.keys(TYPES)){ const b=document.getElementById('type-'+t); b.setAttribute('aria-pressed',t===curType); b.textContent=typeName(t); }
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));
  document.getElementById('play').textContent= playing?tr('pause'):tr('play');
  document.getElementById('night').textContent= night?tr('night'):tr('day');
  document.getElementById('speed').setAttribute('aria-label',tr('speed'));
  document.documentElement.lang = lang==='en'?'en':'zh-Hans';
  for(const l of ['zh','en']) document.getElementById('lang-'+l).setAttribute('aria-pressed',l===lang);
}
function rebuild(){
  if(lamp){ scene.remove(lamp.root); lamp.root.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); }
  lamp=makeLamp(curType); scene.add(lamp.root); renderPanel();
  if(view==='close') goView('close', !window.__started);
}
function setType(k){ curType=k; rebuild(); if(!window.__started) goView(view,true); }
for(const t of Object.keys(TYPES)) document.getElementById('type-'+t).onclick=()=>setType(t);

let speed=1, t=1.5;
const playBtn=document.getElementById('play');
playBtn.onclick=()=>{ playing=!playing; playBtn.textContent=playing?tr('pause'):tr('play'); playBtn.setAttribute('aria-pressed',playing); };
document.getElementById('speed').oninput=e=>speed=+e.target.value;
const nightBtn=document.getElementById('night');
function setNight(n){ night=n; nightBtn.textContent=n?tr('night'):tr('day'); nightBtn.setAttribute('aria-pressed',n);
  hemi.intensity=n?.05:.9; sun.intensity=n?0:1.6; scene.environmentIntensity=n?.13:.7; scene.background.set(n?0x16130f:0xbdb8b0); renderer.toneMappingExposure=n?1.15:.9; }
nightBtn.onclick=()=>setNight(!night); setNight(true);
if(matchMedia('(prefers-reduced-motion: reduce)').matches){ playing=false; playBtn.setAttribute('aria-pressed',false); }
for(const l of ['zh','en']) document.getElementById('lang-'+l).onclick=()=>{ lang=l; try{localStorage.setItem('fvp-lang',l);}catch(e){} renderPanel(); };
try{ const sv=localStorage.getItem('fvp-lang'); if(sv==='en'||sv==='zh') lang=sv; else if(!/^zh/i.test(navigator.language||'')) lang='en'; }catch(e){}

setType('eclipse'); window.__started=true;

const tagEl=document.getElementById('tag'), clock=new THREE.Clock();
function frame(){
  const dt=Math.min(clock.getDelta(),.05); if(playing) t+=dt*speed;
  lamp.update(t);
  if(tween){ tween.t=Math.min(1,tween.t+dt/.8); const e=1-Math.pow(1-tween.t,3);
    controls.target.lerpVectors(tween.f0,tween.f1,e); camera.position.copy(controls.target).add(tween.off); camera.zoom=tween.z0+(tween.z1-tween.z0)*e; camera.updateProjectionMatrix(); if(tween.t>=1) tween=null; }
  controls.update(); scene.updateMatrixWorld(); updateGlints(); renderer.render(scene,camera);
  const p=lamp.tagPos.clone().project(camera), w=stage.clientWidth, h=stage.clientHeight;
  tagEl.hidden=!(Math.abs(p.x)<1.05&&p.y<.92&&p.y>-1); tagEl.style.left=((p.x+1)/2*w)+'px'; tagEl.style.top=((1-p.y)/2*h)+'px';
  if(!window.__noloop) requestAnimationFrame(frame);
}
frame();
window.__dbg={setType, setNight, goView:v=>goView(v,true), setT:x=>{t=x;playing=false;},
  render:()=>{ lamp.update(t); scene.updateMatrixWorld(); updateGlints(); renderer.render(scene,camera); },
  setPart:(k,obj,procs)=>{ const s=state[curType][k]; s.obj=obj; s.procs=new Set(procs); rebuild(); }};
window.__ready=true;
</script>
